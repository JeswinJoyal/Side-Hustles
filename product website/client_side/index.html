<!Doctype html>
<html>
<head>
    <title>Good Picks|Home Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div class="layout-container">
  <main class="main-content">
    <header class="main-header">
        <!-- <img src="images/image1.png"> -->
        <!-- Search Bar -->
        <div class="search-container">
            <span class="search-icon">
            <!-- Using a standard SVG icon instead of an emoji for professional look -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" class="search-input" placeholder="click to search">
        </div>

        <!-- Horizontal Subtabs -->
        <nav class="subtabs-nav">
            <ul class="subtabs-list">
            <li><a href="#" class="active">Explore</a></li>
            <li><a href="#">Women</a></li>
            <li><a href="#">Men</a></li>
            <li><a href="#">Kids</a></li>
            <li><a href="#">Home & Decor</a></li>
            </ul>
        </nav>
    </header>
    
    <section class="product-grid">
      
      <article class="product-card">
        <div class="product-image-container">
          <span class="placeholder-text">Image 1</span>
        </div>
        <div class="product-details">
          <h3 class="product-title">Cotton Summer Dress</h3>
          <p class="product-price">₹1,299</p>
          <button class="add-to-cart-btn">Add to Cart</button>
        </div>
      </article>

      

      </section>
    </main>

  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <span class="icon">🏠</span>
      <span class="label">Home</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">📦</span>
      <span class="label">Products</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">🛒</span>
      <span class="label">Cart</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">👤</span>
      <span class="label">Profile</span>
    </a>
  </nav>
</div>

</body>

</html>
