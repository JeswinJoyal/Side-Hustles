<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Product</title>
    <link rel="stylesheet" href="/css/add-products.css">
</head>
<body>
    <div class="top-nav">
        <button id="back-btn" class="nav-btn">← Back to Dashboard</button>
        <button id="logout-btn" class="nav-btn danger">Logout</button>
    </div>

    <div class="form-container">
        <h2>Add New Product</h2>
        <form id="add-product-form">
            <div class="form-group">
                <label for="name">Product Name *</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="">Select...</option>
                    <option value="Men">Men</option>
                    <option value="Women">Women</option>
                    <option value="Unisex">Unisex</option>
                    <option value="Kids">Kids</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g., Clothing">
            </div>

            <div class="form-group">
                <label for="subcategory">Subcategory</label>
                <input type="text" id="subcategory" name="subcategory" placeholder="e.g., Shirts">
            </div>

            <div class="form-group">
                <label for="sub_subcategory">Sub-Subcategory</label>
                <input type="text" id="sub_subcategory" name="sub_subcategory" placeholder="e.g., T-Shirts">
            </div>

            <div class="form-group">
                <label for="price">Price (₹) *</label>
                <input type="number" id="price" name="price" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="url">Product URL</label>
                <input type="url" id="url" name="url" placeholder="https://...">
            </div>

            <button type="submit" class="submit-btn">Add Product</button>
            <div id="status-message" class="status-message"></div>
        </form>
    </div>

    <script src="/js/add-products.js"></script>
</body>
</html>
