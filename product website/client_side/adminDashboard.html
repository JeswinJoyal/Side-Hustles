<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/adminDashboard.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="brand">Admin Dashboard</div>
        <button class="logout-btn" id="btn-logout">Logout</button>
    </header>

    <!-- Main Menu Area -->
    <main class="dashboard-hub">
        
        <!-- Option 1: Add -->
        <a href="admin/add-product" class="option-card">
            <div class="card-icon">➕</div>
            <h2>Add a Product</h2>
            <p>Upload new items to the store inventory.</p>
        </a>

        <!-- Option 2: Edit -->
        <a href="admin/edit-product" class="option-card edit-card">
            <div class="card-icon">✏️</div>
            <h2>Edit Products</h2>
            <p>Update prices, change stock, or delete items.</p>
        </a>

    </main>

    <script src="/js/dashboard.js"></script>
</body>
</html>
