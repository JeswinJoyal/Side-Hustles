<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Store Management</title>
  <link rel="stylesheet" href="/css/adminLogin.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h2>Admin Access</h2>
        <p>Please log in to manage inventory.</p>
      </div>

      <!-- The form element is crucial for capturing the submit event -->
      <form id="login-form" class="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <!-- type="password" ensures the browser masks the characters -->
          <input type="password" id="password" name="password" required>
        </div>

        <!-- Hidden error message container -->
        <div id="error-message" class="error-message" style="display: none;">
          Invalid username or password.
        </div>

        <button type="submit" class="login-btn">Log In</button>
      </form>
    </div>
  </div>


    <script src="/js/adminLogin.js"></script>

</body>
</html>
